<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cockpit budget</title>
<meta name="description" content="Suivi de budget perso : relevés, objectifs, épargne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</body>
</html>
<style>
/* Layout: cockpit d'opérateur — bandeau de paie en tête, résumé chiffré, puis détail par onglet */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E9E6; --line:#D2DBD6;
  --ink:#12201B; --muted:#4A5A53; --accent:#0F6B4F; --accent-ink:#FFFFFF;
  --warn:#B4470A; --warn-bg:#FBE7DA; --ok-bg:#DDF0E7; --hero:#12201B; --hero-ink:#FFFFFF; --hero-soft:#1F332B; --hero-muted:#B9C9C1;
  --bar2:#6FB89B;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16231E; --sunk:#1E2E28; --line:#2C3F37;
  --ink:#E7EFEB; --muted:#A3B5AD; --accent:#4FC199; --accent-ink:#0B1612;
  --warn:#F0965A; --warn-bg:#3A2418; --ok-bg:#173A2D; --hero:#1E3229; --hero-ink:#F1F6F3; --hero-soft:#27413A; --hero-muted:#A9C2B7;
  --bar2:#2F7A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16231E; --sunk:#1E2E28; --line:#2C3F37;
  --ink:#E7EFEB; --muted:#A3B5AD; --accent:#4FC199; --accent-ink:#0B1612;
  --warn:#F0965A; --warn-bg:#3A2418; --ok-bg:#173A2D; --hero:#1E3229; --hero-ink:#F1F6F3; --hero-soft:#27413A; --hero-muted:#A9C2B7;
  --bar2:#2F7A5E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:34px;letter-spacing:-.02em;font-weight:700}
h2{font-size:19px;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:600 15px var(--sans);padding:10px 16px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.monthpick{display:flex;flex-direction:column;gap:4px}
label.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{resize:vertical;min-height:80px;width:100%}
input.amount{font-family:var(--mono);text-align:right;width:120px}
button{font:inherit}
.btn{font-weight:600;padding:10px 18px;min-height:44px;border-radius:999px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:8px;min-width:36px;min-height:36px;cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{border-color:var(--line);color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row>.grow{flex:999 1 540px;min-width:0}
.row>.side{flex:1 1 320px;min-width:0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.hero .eyebrow{color:var(--hero-muted)}
.virs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;flex:2 1 520px}
.vir{flex:1 1 130px;background:var(--hero-soft);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.vir input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.vir label{display:flex;flex-direction:column;cursor:pointer}
.vir .n{font-size:13px;color:var(--hero-muted)}
.vir .v{font-family:var(--mono);font-size:18px;font-weight:600}
.vir.done .v{text-decoration:line-through;opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:-.02em}
.kpi .sub{font-size:13px;color:var(--muted)}
.bad{color:var(--warn)} .good{color:var(--accent)}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>span{background:var(--warn)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--accent)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acct .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--sunk)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--sunk);vertical-align:middle}
td.r,th.r{text-align:right}
.ops td select{min-width:170px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.drop.on{border-color:var(--accent);background:var(--ok-bg)}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form .f{display:flex;flex-direction:column;gap:4px}
.catline{display:flex;flex-direction:column;gap:5px}
.catline .head{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.empty{padding:24px;border-radius:14px;background:var(--sunk);color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);z-index:20}
.chart text{fill:var(--muted);font:12px var(--mono)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.editrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.editrow input[type=text]{flex:1 1 140px;min-width:0}
.locked{background:var(--ok-bg);color:var(--accent);padding:10px 14px;border-radius:12px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar>span{transition:width .4s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="sub">Salaire mensuel</div>
      <h1>Mon cockpit</h1>
      <div class="muted" style="font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="who" hidden><span id="who-mail"></span><button class="btn ghost small" id="logout" type="button">Se déconnecter</button></div>
    </div>
    <div class="row" style="align-items:flex-end;gap:12px">
      <div class="monthpick">
        <label class="lbl" for="month">Mois</label>
        <input type="month" id="month">
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" id="t-dash" data-tab="dash" aria-selected="true">Tableau de bord</button>
        <button class="tab" role="tab" id="t-rel" data-tab="rel" aria-selected="false">Relevé</button>
        <button class="tab" role="tab" id="t-set" data-tab="set" aria-selected="false">Réglages</button>
      </nav>
    </div>
  </header>
  <section id="auth" class="card" hidden style="max-width:440px;margin:24px auto;width:100%">
    <h2 id="auth-title">Connexion</h2>
    <p class="muted" style="margin:0">Tes données sont privées : toi seul les vois, depuis n'importe quel appareil.</p>
    <form id="authform" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-direction:column;gap:4px"><label class="lbl" for="au-mail">E-mail</label><input type="email" id="au-mail" autocomplete="email" required></div>
      <div style="display:flex;flex-direction:column;gap:4px"><label class="lbl" for="au-pass">Mot de passe (8 caractères minimum)</label><input type="password" id="au-pass" autocomplete="current-password" minlength="8" required></div>
      <button class="btn" type="submit" id="au-go">Se connecter</button>
      <button class="btn ghost" type="button" id="au-switch">Pas encore de compte ? Créer un compte</button>
      <div id="au-msg" class="muted" role="status" style="font-size:14px"></div>
    </form>
  </section>
  <main id="app">
    <div class="empty">Chargement de tes données…</div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
const CATS=[
 {id:'sorties',nom:'Sorties & restos',g:'plaisir'},
 {id:'couple',nom:'Couple',g:'plaisir'},
 {id:'shopping',nom:'Sneakers & shopping',g:'plaisir'},
 {id:'voyages',nom:'Voyages',g:'plaisir'},
 {id:'autre',nom:'Autre / imprévu',g:'plaisir'},
 {id:'courses',nom:'Courses',g:'vie'},
 {id:'transport',nom:'Voiture & transport',g:'vie'},
 {id:'sport',nom:'Sport',g:'vie'},
 {id:'abos',nom:'Abonnements & téléphone',g:'fixe'},
 {id:'papa',nom:'Remboursement de prêt ou dette',g:'fixe'},
 {id:'cadeau',nom:'Cadeaux',g:'projet'},
 {id:'epargne',nom:'Épargne & investissement',g:'epargne'},
 {id:'revenu',nom:'Revenus',g:'revenu'},
 {id:'interne',nom:'Virement interne (ignoré)',g:'interne'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const KEYWORDS=[
 ['epargne',/livret|trade ?republic|\bpea\b|assurance.?vie|epargne|épargne|\bpel\b/],
 ['revenu',/salaire|paie|caf|aide|apl|prime/],
 ['abos',/spotify|netflix|disney|apple|icloud|google|gemini|anthropic|claude|snap|free mobile|bouygues|sfr|orange|sosh|red by|basic.?fit|fitness|salle|deezer|prime video|youtube/],
 ['sorties',/deliveroo|uber ?eats|just ?eat|mcdo|mcdonald|burger|kfc|resto|restaurant|bar |brasserie|pizza|sushi|kebab|starbucks|cafe|café/],
 ['shopping',/nike|snkrs|adidas|zalando|courir|foot ?locker|vinted|zara|h&m|asos|jd sports|amazon|shein|uniqlo/],
 ['courses',/carrefour|leclerc|auchan|lidl|monoprix|intermarch|franprix|aldi|super ?u|casino|picard/],
 ['transport',/uber|sncf|ratp|navigo|total|esso|bp |shell|avia|peage|péage|parking|bolt|heetch|blablacar|ouigo/],
 ['sport',/padel|playtomic|urban|five|decathlon|foot/],
 ['voyages',/airbnb|booking|ryanair|easyjet|air ?france|transavia|vueling|hotel|hôtel/]
];
const SRC={cic:'Compte principal',revolut:'Revolut'};
const srcOf=o=>o.src||'cic';
const COLORS=['var(--ink)','var(--accent)','var(--bar2)','var(--warn)','var(--muted)','var(--line)'];

let impAcc='cic', relSrc='all', db=null, cfg=null, months={}, accHist={}, tab='dash', ready=false, cfgLoaded=false, monthsLoaded=false;
const $app=document.getElementById('app'), $month=document.getElementById('month');
const now=new Date();
const JP=()=>{const j=Math.round(Number(cfg&&cfg.jourPaie)||27);return Math.min(31,Math.max(1,j))};
const payDate=(y,m)=>new Date(y,m,Math.min(JP(),new Date(y,m+1,0).getDate()));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function periodOf(ds){return String(ds).slice(0,7)}
function periodBounds(k){const [y,m]=k.split('-').map(Number);return {start:new Date(y,m-1,1),end:new Date(y,m,0)}}
const fmtD=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const periodLabel=k=>monthLabel(k);
function nextPay(){const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());let d=payDate(now.getFullYear(),now.getMonth());if(d<t)d=payDate(now.getFullYear(),now.getMonth()+1);return d}
let cur=periodOf(ymd(now)), curAuto=true;
$month.value=cur;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=(n,d=0)=>(Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})+' €';
const uid=()=>Math.random().toString(36).slice(2,10);
const monthLabel=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const shortMonth=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'short'})};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- persistence ---------- */
let cfgTimer=null, cfgDirty=0; const monthTimers={}, monthDirty={};
function saveCfg(){ if(!db) return; cfgDirty++; clearTimeout(cfgTimer); cfgTimer=setTimeout(()=>db.doc('config/main').set(JSON.parse(JSON.stringify(cfg))).catch(err).finally(()=>{cfgDirty=0}),400) }
function saveMonth(k){ if(!db) return; monthDirty[k]=1; clearTimeout(monthTimers[k]); monthTimers[k]=setTimeout(()=>db.doc('mois/'+k).set(JSON.parse(JSON.stringify(months[k]))).catch(err).finally(()=>{monthDirty[k]=0}),400) }
function err(e){ toast(e&&e.code==='quota_exceeded'?'Stockage plein : supprime d’anciens mois.':'Sauvegarde impossible pour le moment, réessaie.') }
function getMonth(k){ if(!months[k]) months[k]={mois:k,ops:[],note:'',cloture:false,virs:[]}; const m=months[k]; m.ops=m.ops||[]; m.virs=m.virs||[]; return m }

/* ---------- computations ---------- */
function daysLeft(k){const b=periodBounds(k);const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(t<b.start||t>b.end)return 0;return Math.round((b.end-t)/864e5)+1}
function compteVal(id){const c=(cfg.comptes||[]).find(x=>x.id===id);return c?Number(c.montant)||0:0}
function goalActual(o){return o.compteId?compteVal(o.compteId):Number(o.actuel)||0}
function paiesAvant(ech){ if(!ech) return 0; const end=new Date(ech+'T23:59:59'); let n=0; let y=now.getFullYear(),mo=now.getMonth(); const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()); if(payDate(y,mo)<t) mo++; while(payDate(y,mo)<=end && n<240){n++; mo++} return n }
function stats(k){
  const m=months[k]; const ops=m?m.ops:[];
  const by={}; CATS.forEach(c=>by[c.id]=0);
  let rev=0;
  ops.forEach(o=>{const a=Number(o.montant)||0; const c=CAT[o.cat]?o.cat:'autre';
    if(c==='revenu'){rev+=a} else {by[c]+= -a}});
  const revenus=rev>0?rev:(Number(cfg.revenus)||0);
  const epargne=by.epargne;
  let dep=0,plaisir=0; CATS.forEach(c=>{ if(c.g!=='epargne'&&c.g!=='revenu'&&c.g!=='interne'){dep+=by[c.id]; if(c.g==='plaisir') plaisir+=by[c.id]} });
  return {by,revenus,epargne,dep,plaisir,taux:revenus>0?epargne/revenus:0,n:ops.length,revSource:rev>0?'relevé':'réglages'};
}

/* ---------- CSV ---------- */
function splitCSV(text){
  const first=text.split(/\r?\n/).slice(0,5).join('\n');
  const cnt=ch=>(first.match(new RegExp(ch==='\t'?'\\t':'\\'+ch,'g'))||[]).length;
  const delim=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=ch }
    else if(ch==='"') q=true;
    else if(ch===delim){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); if(row.some(c=>c.trim()!=='')) rows.push(row); row=[];cell='' }
    else cell+=ch }
  row.push(cell); if(row.some(c=>c.trim()!=='')) rows.push(row);
  return rows.map(r=>r.map(c=>c.trim()));
}
function pNum(s){ if(s==null) return NaN; s=String(s).replace(/[\s €]|EUR/gi,''); if(!s) return NaN; if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,''); s=s.replace(',','.'); if(!/^[-+]?\d*\.?\d+$/.test(s)) return NaN; return parseFloat(s) }
function pDate(s){ s=String(s||''); let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){let y=+m[3]; if(y<100) y+=2000; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')} m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[1]+'-'+m[2]+'-'+m[3]:null }
function parseBank(text){
  const rows=splitCSV(text); if(rows.length<2) return null;
  let h=rows.findIndex(r=>r.some(c=>/date/i.test(c))&&r.some(c=>/montant|amount|d[ée]bit|cr[ée]dit/i.test(c)));
  let iD=-1,iL=-1,iM=-1,iDe=-1,iC=-1,iS=-1,iT=-1,iSt=-1,iF=-1,iP=-1, body;
  if(h>=0){ const H=rows[h].map(c=>c.toLowerCase());
    H.forEach((c,i)=>{ if(/date/.test(c)&&(iD<0||/op[ée]r/.test(c))) iD=i;
      if(/libell|label|description|d[ée]tail|intitul|nom/.test(c)&&!/date/.test(c)&&iL<0) iL=i;
      if(/solde|balance/.test(c)&&iS<0) iS=i; if(/montant|amount/.test(c)&&!/solde/.test(c)&&iM<0) iM=i; if(/d[ée]bit/.test(c)&&iDe<0) iDe=i; if(/cr[ée]dit/.test(c)&&iC<0) iC=i; if(/^type$/.test(c)) iT=i; if(/^(state|[ée]tat|statut)$/.test(c)) iSt=i; if(/^(fee|fees|frais)$/.test(c)) iF=i; if(/^(product|produit)$/.test(c)) iP=i; });
    body=rows.slice(h+1);
  } else {
    body=rows; const w=Math.max(...rows.map(r=>r.length)); let best=0;
    for(let i=0;i<w;i++){ const col=rows.map(r=>r[i]); const dates=col.filter(pDate).length, nums=col.filter(c=>!isNaN(pNum(c))).length, len=col.reduce((s,c)=>s+(c||'').length,0)/col.length;
      if(dates>rows.length*.6&&iD<0) iD=i; else if(nums>rows.length*.6) iM=i; else if(len>best){best=len;iL=i} }
  }
  if(iD<0||iL<0||(iM<0&&iDe<0&&iC<0)) return null;
  const out=[];
  body.forEach(r=>{ const d=pDate(r[iD]); if(!d) return; let a;
    if(iSt>=0&&/revert|declin|fail|annul|rejet|refus|pending|en attente/i.test(r[iSt]||'')) return;
    if(iP>=0&&/saving|[ée]pargne|deposit|coffre|vault/i.test(r[iP]||'')) return;

const num=v=>{const n=pNum(v);return isNaN(n)?0:n};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab].tab'); if(!t) return;
  if(t.classList.contains('tab')){tab=t.dataset.tab;render();return}
  const a=t.dataset.act;
  if(a==='goto'){tab=t.dataset.tab;render();window.scrollTo({top:0})}
  else if(a==='pick'){document.getElementById('csv').click()}
  else if(a==='del'){const m=getMonth(cur);m.ops=m.ops.filter(o=>o.id!==t.dataset.id);saveMonth(cur);render()}

    if(!m.ops.length){toast('Saisis d’abord tes opérations du mois.');return}

    m.note=note;m.cloture=true;saveMonth(cur);toast('Mois clôturé.');render()}

  else if(a==='export'){const blob=new Blob([JSON.stringify({v:1,config:cfg,mois:months,comptes:accHist},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='cockpit-sauvegarde-'+ymd(new Date())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='importbak'){document.getElementById('bak').click()}
  else if(a==='viradd'){(cfg.virements=cfg.virements||[]).push({nom:'Nouveau virement',montant:0});saveCfg();render()}
  else if(a==='virdel'){cfg.virements.splice(+t.dataset.i,1);saveCfg();render()}
  else if(a==='accadd'){(cfg.comptes=cfg.comptes||[]).push({id:uid(),nom:'Nouveau compte',montant:0,dispo:false});saveCfg();render()}
  else if(a==='accdel'){const id=t.dataset.id;cfg.comptes=cfg.comptes.filter(c=>c.id!==id);(cfg.objectifs||[]).forEach(o=>{if(o.compteId===id){o.actuel=0;o.compteId=''}});saveCfg();render()}
  else if(a==='goaladd'){(cfg.objectifs=cfg.objectifs||[]).push({id:uid(),nom:'Nouvel objectif',cible:1000,actuel:0,echeance:'',compteId:''});saveCfg();render()}
  else if(a==='goaldel'){cfg.objectifs=cfg.objectifs.filter(o=>o.id!==t.dataset.id);saveCfg();render()}
});
document.addEventListener('change',e=>{
  const t=e.target; const a=t.dataset&&t.dataset.act;
  if(t.id==='month'){ if(/^\d{4}-\d{2}$/.test(t.value)){cur=t.value;curAuto=(cur===periodOf(ymd(now)));render()} return }

  else if(a==='note'){const m=getMonth(cur);m.note=t.value;saveMonth(cur)}
  else if(a==='cfg'){cfg[t.dataset.k]=num(t.value);saveCfg();render()}
  else if(a==='bud'){(cfg.budgets=cfg.budgets||{})[t.dataset.k]=num(t.value);saveCfg();render()}
  else if(a==='virset'){const v=cfg.virements[+t.dataset.i];v[t.dataset.k]=t.dataset.k==='montant'?num(t.value):t.value;saveCfg();render()}
  else if(a==='accset'){const c=cfg.comptes.find(x=>x.id===t.dataset.id);if(!c)return;const k=t.dataset.k;c[k]=k==='dispo'?t.checked:k==='montant'?num(t.value):t.value;saveCfg();render()}
  else if(a==='goal'){const o=cfg.objectifs.find(x=>x.id===t.dataset.id);if(!o)return;const k=t.dataset.k;o[k]=(k==='cible'||k==='actuel')?num(t.value):t.value;saveCfg();render()}
});

function readFile(f){ if(!f) return; const r=new FileReader();
  r.onload=()=>{ let txt=String(r.result||''); if(txt.includes(String.fromCharCode(65533))){ const r2=new FileReader(); r2.onload=()=>finish(String(r2.result||'')); r2.readAsText(f,'windows-1252'); } else finish(txt) };
  r.onerror=()=>toast('Impossible de lire ce fichier.');
  r.readAsText(f,'utf-8');
  function finish(t){ const ops=parseBank(t); if(!ops){toast('Colonnes non reconnues : il faut une date, un libellé et un montant (ou débit/crédit).');return} if(!ops.length){toast('Aucune opération trouvée dans ce fichier.');return} if(impAcc==='cic'||impAcc==='revolut') importOps(ops,impAcc); else importSavings(impAcc,ops) } }

function makeDb(){
  const T='docs';
  const snap=(path,row)=>({id:path.split('/').pop(),exists:!!row,data:()=>row?row.data:undefined,metadata:{hasPendingWrites:false,fromCache:false}});
  return {
    doc(path){ return {
      set:async d=>{ const {error}=await sb.from(T).upsert({user_id:uidCur,path,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id,path'}); if(error) throw {code:'unavailable',message:error.message} },
      delete:async()=>{ const {error}=await sb.from(T).delete().eq('user_id',uidCur).eq('path',path); if(error) throw {code:'unavailable',message:error.message} },
      onSnapshot(next,fail){ sb.from(T).select('path,data').eq('user_id',uidCur).eq('path',path).maybeSingle().then(({data,error})=>{ if(error){fail&&fail(error);return} next(snap(path,data)) }); return ()=>{} }
    }},
    collection(c){ return { onSnapshot(next,fail){ sb.from(T).select('path,data').eq('user_id',uidCur).like('path',c+'/%').limit(1000).then(({data,error})=>{ if(error){fail&&fail(error);return} next({docs:(data||[]).map(r=>snap(r.path,r))}) }); return ()=>{} } } }
  };
}
async function restoreBackup(f){
  try{ const j=JSON.parse(await f.text()); if(!j||!j.config){toast('Fichier de sauvegarde non reconnu.');return}
    const rows=[{path:'config/main',data:j.config}];
    Object.keys(j.mois||{}).forEach(k=>rows.push({path:'mois/'+k,data:j.mois[k]}));
    Object.keys(j.comptes||{}).forEach(k=>rows.push({path:'comptes/'+k,data:j.comptes[k]}));
    const {error}=await sb.from('docs').upsert(rows.map(r=>({user_id:uidCur,...r,updated_at:new Date().toISOString()})),{onConflict:'user_id,path'});
    if(error){toast('Restauration impossible : '+error.message);return}
    cfg=j.config; months=j.mois||{}; accHist=j.comptes||{}; toast('Sauvegarde restaurée.'); render();
  }catch(e){toast('Fichier illisible.')}
}
function loadAll(){
  db=makeDb(); cfg=null; months={}; accHist={}; cfgLoaded=false; monthsLoaded=false; migrated=false; ready=true; tab='dash';
  db.doc('config/main').onSnapshot(s=>{ cfg=s.exists?JSON.parse(JSON.stringify(s.data())):null; cfgLoaded=true; render() },()=>{cfgLoaded=true;render()});
  db.collection('comptes').onSnapshot(q=>{ accHist={}; q.docs.forEach(d=>{accHist[d.id]=JSON.parse(JSON.stringify(d.data()))}); render() },()=>{});
  db.collection('mois').onSnapshot(q=>{ q.docs.forEach(d=>{ months[d.id]=JSON.parse(JSON.stringify(d.data())) }); monthsLoaded=true; migrate(); render() },()=>{monthsLoaded=true;render()});
}
function showAuth(on){ document.getElementById('auth').hidden=!on; $app.hidden=on; document.querySelector('.tabs').hidden=on; document.querySelector('.monthpick').hidden=on; document.getElementById('who').hidden=on }
let signup=false;
document.getElementById('au-switch').addEventListener('click',()=>{ signup=!signup; document.getElementById('auth-title').textContent=signup?'Créer un compte':'Connexion'; document.getElementById('au-go').textContent=signup?'Créer mon compte':'Se connecter'; document.getElementById('au-switch').textContent=signup?'J’ai déjà un compte : me connecter':'Pas encore de compte ? Créer un compte'; document.getElementById('au-pass').autocomplete=signup?'new-password':'current-password'; document.getElementById('au-msg').textContent='' });
document.getElementById('authform').addEventListener('submit',async e=>{ e.preventDefault(); const email=document.getElementById('au-mail').value.trim(), password=document.getElementById('au-pass').value, msg=document.getElementById('au-msg');
  msg.textContent=signup?'Création du compte…':'Connexion…';
  const r=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});
  if(r.error){ msg.textContent=/invalid login/i.test(r.error.message)?'E-mail ou mot de passe incorrect.':/registered/i.test(r.error.message)?'Un compte existe déjà avec cet e-mail : connecte-toi.':'Erreur : '+r.error.message; return }
  if(signup&&!r.data.session){ msg.textContent='Compte créé. Clique sur le lien reçu par e-mail pour l’activer, puis reviens te connecter.'; return }
  msg.textContent='' });
document.getElementById('logout').addEventListener('click',async()=>{ await sb.auth.signOut() });
(function boot(){
  if(!window.supabase||!SUPABASE_URL){ ready=true; $app.innerHTML='<div class="empty">Configuration manquante : renseigne SUPABASE_URL et SUPABASE_ANON_KEY en bas du fichier index.html.</div>'; return }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session&&session.user;
    if(u&&u.id!==uidCur){ uidCur=u.id; document.getElementById('who-mail').textContent=u.email||''; showAuth(false); $app.innerHTML='<div class="empty">Chargement de tes données…</div>'; loadAll() }
    else if(!u){ uidCur=null; db=null; showAuth(true) } });
})();
})();
</script>
